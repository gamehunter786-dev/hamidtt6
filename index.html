<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamid Raza</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--text:#1d1d1b;--muted:#77756f;--line:#e4e2dc;--accent:#3b5bdb;--accent-text:#fff;--mine:#e7ecff;--err:#c92a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--surface:#1f1f1d;--text:#ececea;--muted:#9a978f;--line:#32312e;--accent:#7c93ff;--accent-text:#10131f;--mine:#262c4a;--err:#ff8787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--surface:#1f1f1d;--text:#ececea;--muted:#9a978f;--line:#32312e;--accent:#7c93ff;--accent-text:#10131f;--mine:#262c4a;--err:#ff8787;color-scheme:dark}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);padding:6px 12px;font-size:14px}
#auth{flex:1;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px 0;background:transparent;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.card p{margin:0 0 14px;color:var(--muted);font-size:14px}
.card input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:12px}
.card .go{width:100%;padding:11px 0}
#err{color:var(--err);font-size:14px;min-height:20px;margin:0 0 10px}
#list{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:85%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:14px}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:0}
.me .bub{background:var(--mine)}
.meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.meta b{color:var(--text);font-weight:600}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:24px 12px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px}
.row{max-width:760px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:120px}
textarea:focus,.card input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <div class="t"><h1>💬 Hamid Raza</h1><p id="sub">Live group chat</p></div>
  <button class="ghost" id="out" hidden>Log out</button>
</header>

<div id="auth">
  <div class="card">
    <div class="tabs"><button id="tl" class="on">Login</button><button id="tr">Register</button></div>
    <p id="hint">Connecting…</p>
    <input id="name" placeholder="Choose a username" maxlength="20" hidden>
    <input id="code" placeholder="Access code" maxlength="40" autocomplete="off" hidden>
    <div id="err"></div>
    <button class="go" id="go" disabled>Login</button>
  </div>
</div>

<div id="list" hidden></div>
<footer id="foot" hidden><div class="row">
  <textarea id="box" rows="1" placeholder="Type a message…" maxlength="1000"></textarea>
  <button id="send">Send</button>
</div></footer>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var ACCESS_CODE='HAMID2026';
var db=null,me=null,profiles={},msgs=[],logged=false,tab='login',busy=false,firstProf=true;
var colors=['#e03131','#2f9e44','#1971c2','#f08c00','#9c36b5','#0c8599','#d6336c','#5f3dc4'];
function color(id){var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))|0;return colors[Math.abs(h)%colors.length]}
function myName(){return profiles[me]&&profiles[me].name}

function setTab(t){
  tab=t;$('tl').className=t==='login'?'on':'';$('tr').className=t==='register'?'on':'';
  $('name').hidden=t!=='register';$('code').hidden=t!=='register';$('go').textContent=t==='login'?'Login':'Register';$('err').textContent='';
  if(!db){$('hint').textContent='Please sign in to claude.ai to use this chat.';return}
  if(t==='login')$('hint').textContent=myName()?('Welcome back, '+myName()+'. Tap Login to continue.'):'Log in with your registered account.';
  else $('hint').textContent=myName()?('You’re already registered as '+myName()+'. Use Login.'):'Pick a username that others will see in the chat.';
}
function showApp(){
  $('auth').hidden=logged;$('list').hidden=!logged;$('foot').hidden=!logged;$('out').hidden=!logged;
  $('sub').textContent=logged?('Signed in as '+myName()):'Live group chat';
  if(logged)render();else setTab(myName()?'login':'register');
}
async function go(){
  $('err').textContent='';
  if(!db||!me)return;
  if(tab==='login'){
    if(!myName()){$('err').textContent='No account found. Please register first.';setTab('register');return}
    logged=true;showApp();return;
  }
  if(myName()){$('err').textContent='You already have an account. Use Login.';return}
  if($('code').value.trim()!==ACCESS_CODE){$('err').textContent='Wrong access code.';return}
  var n=$('name').value.trim();
  if(n.length<2){$('err').textContent='Username must be at least 2 characters.';return}
  var low=n.toLowerCase();
  for(var k in profiles){if(profiles[k]&&String(profiles[k].name).toLowerCase()===low){$('err').textContent='That username is taken.';return}}
  $('go').disabled=true;
  try{await db.doc('profiles/'+me).set({name:n,ts:Date.now()});profiles[me]={name:n};logged=true;showApp()}
  catch(e){$('err').textContent='Couldn’t register. You may need Contributor access.'}
  $('go').disabled=false;
}
function render(){
  if(!logged)return;
  var near=list.scrollHeight-list.scrollTop-list.clientHeight<120;
  list.textContent='';
  if(!msgs.length){var e=document.createElement('div');e.className='empty';e.textContent='No messages yet. Say hello!';list.appendChild(e);return}
  msgs.forEach(function(m){
    var mine=m.uid===me,p=profiles[m.uid],nm=mine?'You':((p&&p.name)||'Someone');
    var w=document.createElement('div');w.className='msg'+(mine?' me':'');
    var av=document.createElement('div');av.className='av';av.style.background=color(m.uid||'x');
    av.textContent=((p&&p.name)||'?').charAt(0).toUpperCase();
    var b=document.createElement('div');b.className='bub';
    var meta=document.createElement('div');meta.className='meta';
    var n=document.createElement('b');n.textContent=nm;
    var t=document.createElement('span');t.textContent=' · '+new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    meta.appendChild(n);meta.appendChild(t);
    var x=document.createElement('div');x.className='txt';x.textContent=m.text;
    b.appendChild(meta);b.appendChild(x);w.appendChild(av);w.appendChild(b);list.appendChild(w);
  });
  if(near||busy)list.scrollTop=list.scrollHeight;
}
var list=$('list'),box=$('box');
async function post(){
  var text=box.value.trim();if(!text||!db||!logged||busy)return;
  busy=true;$('send').disabled=true;
  try{await db.collection('messages').add({uid:me,text:text,ts:Date.now()});box.value='';box.style.height='auto'}
  catch(e){$('sub').textContent='Couldn’t send: you may need Contributor access.'}
  busy=false;$('send').disabled=false;box.focus();
}
$('tl').addEventListener('click',function(){setTab('login')});
$('tr').addEventListener('click',function(){setTab('register')});
$('go').addEventListener('click',go);
$('name').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
$('out').addEventListener('click',function(){logged=false;showApp()});
$('send').addEventListener('click',post);
box.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();post()}});
box.addEventListener('input',function(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,120)+'px'});

async function start(){
  var user=null;
  try{if(window.claude){db=await claude.use('db');user=await claude.use('user')}}catch(e){}
  if(!db||!user){db=null;setTab('login');return}
  try{me=await user.id()}catch(e){}
  if(!me){db=null;setTab('login');return}
  $('go').disabled=false;setTab('register');
  db.collection('profiles').onSnapshot(function(snap){
    profiles={};snap.docs.forEach(function(d){profiles[d.id]=d.data()});
    if(firstProf){firstProf=false;setTab(myName()?'login':'register')}
    if(logged){$('sub').textContent='Signed in as '+(myName()||'');render()}
  },function(){$('hint').textContent='Couldn’t load accounts.'});
  db.collection('messages').orderBy('ts','asc').limit(300).onSnapshot(function(snap){
    msgs=snap.docs.map(function(d){return d.data()}).filter(function(m){return m&&typeof m.text==='string'});
    render();
  },function(){});
}
setTab('login');
start();
})();
</script>
</body>
</html>
